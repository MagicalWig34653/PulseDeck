name: Screenshots

# Launches the real app on a macOS runner and captures README screenshots, the rendered
# app icon and the mounted DMG window. Run manually; set `commit` to push the images
# to docs/images on the selected branch.
on:
  workflow_dispatch:
    inputs:
      commit:
        description: Commit the images to docs/images on this branch
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: macos-26
    timeout-minutes: 30
    env:
      APP: build/DerivedData/Build/Products/Release/PulseDeck.app
      OUT: docs/images
    steps:
      - uses: actions/checkout@v4

      - name: Build app
        run: |
          set -o pipefail
          xcodebuild build \
            -project PulseDeck.xcodeproj \
            -scheme PulseDeck \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= \
            | tail -n 5

      - name: Capture main window
        run: |
          mkdir -p "$OUT"
          # Apple Events may wait for an Automation consent prompt nobody can answer.
          with_timeout() { perl -e 'alarm 20; exec @ARGV' "$@"; }
          set_dark_mode() {
            # AppKit reads the appearance from the global domain at launch, not from the
            # argument domain, so the runner's global preference is switched instead.
            if [[ "$1" == true ]]; then
              defaults write -g AppleInterfaceStyle Dark
            else
              defaults delete -g AppleInterfaceStyle 2>/dev/null || true
            fi
            with_timeout osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $1" || true
          }
          capture() {
            local name="$1" dark="$2"; shift 2
            set_dark_mode "$dark"
            # `open` launches like Finder does, so the app becomes active and its window key.
            open -n "$APP" --args "$@"
            # Let a good part of the 60-second history fill before capturing.
            sleep 40
            with_timeout osascript -e 'tell application "PulseDeck" to activate' || true
            sleep 2
            swift scripts/capture-window.swift PulseDeck "$OUT/$name.png" 600 2000
            pkill -x PulseDeck || true
            sleep 3
          }
          # Preferences are passed in the argument domain, so the runner's app defaults stay untouched.
          capture performance-light false -navigationPresentation topBar
          capture performance-dark true -navigationPresentation topBar
          capture sidebar-light false -navigationPresentation sidebar
          capture sidebar-dark true -navigationPresentation sidebar
          capture cpu-cores-dark true -navigationPresentation topBar -cpuChartMode logicalProcessors
          capture memory-light false -navigationPresentation topBar -initialCategory memory
          capture network-dark true -navigationPresentation topBar -initialCategory network
          capture disks-light false -navigationPresentation topBar -initialCategory disks
          capture gpu-dark true -navigationPresentation topBar -initialCategory gpu
          capture energy-light false -navigationPresentation topBar -initialCategory energy
          capture processes-light false -navigationPresentation topBar -initialSection processes
          capture processes-dark true -navigationPresentation sidebar -initialSection processes
          set_dark_mode false

      - name: Capture menu bar panel
        # Best effort: clicking the status item needs Accessibility access for the runner's
        # shell. Without it the step leaves no image and the README keeps the previous one.
        continue-on-error: true
        run: |
          with_timeout() { perl -e 'alarm 20; exec @ARGV' "$@"; }
          for dark in false true; do
            if [[ "$dark" == true ]]; then defaults write -g AppleInterfaceStyle Dark; name=menubar-dark; else defaults delete -g AppleInterfaceStyle 2>/dev/null || true; name=menubar-light; fi
            # The panel follows the live system appearance, so switch it as well (as for the window).
            with_timeout osascript -e "tell application \"System Events\" to tell appearance preferences to set dark mode to $dark" || true
            defaults write de.linolaske.PulseDeck showMainWindowAtLaunch -bool NO
            open -n "$APP" --args -menuBarMetric cpu
            sleep 30
            with_timeout osascript -e 'tell application "System Events" to tell process "PulseDeck" to click menu bar item 1 of menu bar 2'
            sleep 4
            swift scripts/capture-window.swift PulseDeck "$OUT/$name.png" 300 420 any-layer
            pkill -x PulseDeck || true
            sleep 3
          done
          defaults delete de.linolaske.PulseDeck showMainWindowAtLaunch 2>/dev/null || true
          defaults delete -g AppleInterfaceStyle 2>/dev/null || true

      - name: Export rendered app icon
        run: |
          icns=$(find "$APP/Contents/Resources" -name '*.icns' | head -n 1)
          echo "icns: $icns"
          sips -s format png -Z 512 "$icns" --out "$OUT/app-icon.png"

      - name: Capture DMG window
        run: |
          scripts/build-dmg.sh "$APP" preview build/PulseDeck-preview.dmg
          hdiutil attach build/PulseDeck-preview.dmg -mountpoint "/Volumes/PulseDeck preview"
          open "/Volumes/PulseDeck preview"
          sleep 6
          swift scripts/capture-window.swift Finder "$OUT/dmg-window.png" 600 800
          hdiutil detach "/Volumes/PulseDeck preview" || true

      - name: Upload images
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: docs/images

      - name: Commit images
        if: inputs.commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/images
          git diff --cached --quiet && exit 0
          git commit -m "Update screenshots"
          git push
