name: CI

# Runs once per pull-request update (not also for the branch push) and on main (keeps the README
# badge current), never for documentation or screenshot-only changes. Run it manually
# (workflow_dispatch) when needed.
on:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

# A newer push to the same PR supersedes the running check.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build app and run tests (macOS 26)
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Core package tests (swift test)
        working-directory: PulseDeckKit
        run: swift test -Xswiftc -warnings-as-errors

      # One build for app and tests: `xcodebuild test` builds the app (warnings as errors) and runs
      # the scheme's tests. A separate `xcodebuild build` with different settings would compile
      # everything a second time.
      - name: Build app and test via Xcode scheme
        run: |
          set -o pipefail
          xcodebuild test \
            -project PulseDeck.xcodeproj \
            -scheme PulseDeck \
            -destination 'platform=macOS' \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            | tee xcodebuild-test.log

      - name: Verify app icon was compiled
        run: |
          resources=DerivedData/Build/Products/Debug/PulseDeck.app/Contents/Resources
          ls -la "$resources"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$resources/../Info.plist"
          test -n "$(find "$resources" -name '*.icns')"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: xcodebuild-*.log
